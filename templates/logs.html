<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Logs — Backup Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0f1923;
            --bg-card: #1a2d3d;
            --accent: #00d4ff;
            --text: #e0e8f0;
            --text-dim: #8899aa;
            --success: #00e676;
            --danger: #ff5252;
        }
        body {
            background: var(--bg-primary);
            color: var(--text);
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .navbar-custom {
            background: linear-gradient(135deg, #0a1628 0%, #1a2d3d 100%);
            border-bottom: 1px solid rgba(0,212,255,0.1);
        }
        .navbar-custom .brand {
            font-weight: 600;
            color: var(--accent);
            text-decoration: none;
        }
        .log-wrapper {
            background: #0d1117;
            border: 1px solid rgba(0,212,255,0.08);
            border-radius: 12px;
            overflow: hidden;
        }
        .log-header {
            background: rgba(0,0,0,0.3);
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(0,212,255,0.08);
        }
        .log-content {
            padding: 0;
        }
        .log-content pre {
            background: transparent;
            color: #c9d1d9;
            padding: 1.5rem;
            margin: 0;
            font-size: 0.8rem;
            line-height: 1.7;
            max-height: 70vh;
            overflow-y: auto;
            font-family: 'Cascadia Code', 'Fira Code', monospace;
        }
        .log-content pre .log-ok { color: var(--success); }
        .log-content pre .log-fail { color: var(--danger); }
        .log-content pre .log-time { color: var(--text-dim); }
        .btn-act {
            background: transparent;
            border: 1px solid rgba(0,212,255,0.2);
            color: var(--accent);
            border-radius: 6px;
            padding: 0.3rem 0.8rem;
            font-size: 0.8rem;
            transition: all 0.2s;
            cursor: pointer;
        }
        .btn-act:hover {
            background: rgba(0,212,255,0.1);
            color: #fff;
        }
        .btn-refresh {
            background: transparent;
            border: 1px solid rgba(0,212,255,0.2);
            color: var(--accent);
            border-radius: 6px;
            padding: 0.3rem 0.8rem;
            font-size: 0.8rem;
            transition: all 0.2s;
            text-decoration: none;
        }
        .btn-refresh:hover {
            background: rgba(0,212,255,0.1);
            color: #fff;
        }
        .empty-state {
            padding: 3rem;
            text-align: center;
            color: var(--text-dim);
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-primary); }
        ::-webkit-scrollbar-thumb { background: var(--bg-card); border-radius: 3px; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand navbar-custom mb-4">
    <div class="container">
        <a class="navbar-brand brand" href="/">
            <i class="fas fa-arrow-left me-2" style="color: var(--text-dim);"></i>Backup Portal
        </a>
        <span><i class="fas fa-terminal me-1" style="color: var(--accent);"></i> Logs do Sistema</span>
        <div class="dropdown">
            <button class="btn-act dropdown-toggle" style="border-color:rgba(0,212,255,0.2);" data-bs-toggle="dropdown">
                <i class="fas fa-user"></i>
            </button>
            <ul class="dropdown-menu dropdown-menu-end" style="background:#1a2d3d;border:1px solid rgba(0,212,255,0.08);border-radius:12px;padding:0.5rem;min-width:180px;">
                <li style="padding:0.25rem 0.75rem;font-size:0.75rem;color:var(--text-dim);"><i class="fas fa-user me-1" style="color:var(--accent);"></i>{{ session.get("nome", session.get("username", "")) }}</li>
                <li><hr style="margin:0.3rem 0;border-color:rgba(0,212,255,0.08);"></li>
                <li><a href="/change-password" class="dropdown-item" style="color:var(--text);font-size:0.8rem;border-radius:8px;padding:0.4rem 0.75rem;"><i class="fas fa-key me-2" style="color:var(--accent-dim);"></i>Alterar Senha</a></li>
                <li><a href="/logout" class="dropdown-item" style="color:var(--danger);font-size:0.8rem;border-radius:8px;padding:0.4rem 0.75rem;"><i class="fas fa-sign-out-alt me-2"></i>Sair</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container">
    <div class="log-wrapper">
        <div class="log-header">
            <span><i class="fas fa-list me-2" style="color: var(--accent-dim);"></i>Últimos Eventos</span>
            <div>
                <span style="color: var(--text-dim); font-size: 0.85rem; margin-right: 1rem;">{{ logs|length }} entradas</span>
                <a href="/logs" class="btn-refresh"><i class="fas fa-sync-alt me-1"></i> Atualizar</a>
            </div>
        </div>
        <div class="log-content">
            {% if logs %}
            <pre>{% for line in logs %}{{ line }}
{% endfor %}</pre>
            {% else %}
            <div class="empty-state">
                <i class="fas fa-terminal" style="font-size: 3rem; opacity: 0.3; margin-bottom: 1rem;"></i>
                <p>Nenhum log encontrado</p>
            </div>
            {% endif %}
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
