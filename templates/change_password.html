<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Backup Portal — Alterar Senha</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #080c14;
            font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .pw-wrap {
            background: linear-gradient(145deg, #111827, #0f1724);
            border: 1px solid rgba(56,189,248,0.08);
            border-radius: 24px;
            padding: 3rem 2.5rem;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.5);
        }
        .pw-wrap .icon {
            text-align: center;
            font-size: 2.5rem;
            color: #38bdf8;
            margin-bottom: 0.5rem;
        }
        .pw-wrap h1 {
            text-align: center;
            font-size: 1.4rem;
            font-weight: 800;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.3rem;
        }
        .pw-wrap .sub {
            text-align: center;
            font-size: 0.8rem;
            color: #64748b;
            margin-bottom: 2rem;
        }
        .pw-wrap .alert-box {
            background: rgba(234,179,8,0.1);
            border: 1px solid rgba(234,179,8,0.2);
            border-radius: 8px;
            padding: 0.6rem 1rem;
            font-size: 0.8rem;
            color: #eab308;
            text-align: center;
            margin-bottom: 1.5rem;
        }
        .pw-wrap label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #64748b;
            margin-bottom: 0.3rem;
            display: block;
        }
        .pw-wrap input {
            width: 100%;
            background: #162032;
            border: 1px solid rgba(56,189,248,0.08);
            border-radius: 10px;
            padding: 0.7rem 1rem;
            color: #e2e8f0;
            font-size: 0.9rem;
            transition: all 0.3s;
            margin-bottom: 1.2rem;
        }
        .pw-wrap input:focus {
            outline: none;
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56,189,248,0.1);
        }
        .pw-wrap button {
            width: 100%;
            background: linear-gradient(135deg, #38bdf8, #0284c7);
            border: none;
            border-radius: 10px;
            padding: 0.75rem;
            font-weight: 700;
            color: #fff;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s;
        }
        .pw-wrap button:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 25px rgba(56,189,248,0.2);
        }
        .erro {
            background: rgba(239,68,68,0.1);
            color: #ef4444;
            border: 1px solid rgba(239,68,68,0.2);
            border-radius: 8px;
            padding: 0.5rem;
            font-size: 0.8rem;
            text-align: center;
            margin-bottom: 1rem;
        }
        .pw-wrap .footer {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.7rem;
            color: #475569;
        }
    </style>
</head>
<body>
    <div class="pw-wrap">
        <div class="icon"><i class="fas fa-key"></i></div>
        <h1>Alterar Senha</h1>
        {% if forced %}
        <p class="sub">Você precisa alterar sua senha antes de continuar</p>
        <div class="alert-box"><i class="fas fa-info-circle me-1"></i> Primeiro acesso — troque sua senha</div>
        {% else %}
        <p class="sub">Digite sua senha atual e a nova senha</p>
        {% endif %}
        {% if erro %}
        <div class="erro"><i class="fas fa-exclamation-circle me-1"></i>{{ erro }}</div>
        {% endif %}
        <form method="POST">
            <label><i class="fas fa-lock me-1"></i>Senha Atual</label>
            <input type="password" name="current" placeholder="••••••" required autofocus>
            <label><i class="fas fa-key me-1"></i>Nova Senha</label>
            <input type="password" name="newpass" placeholder="••••••" required>
            <label><i class="fas fa-check me-1"></i>Confirmar Nova Senha</label>
            <input type="password" name="confirm" placeholder="••••••" required>
            <button type="submit"><i class="fas fa-save me-2"></i>Salvar</button>
        </form>
        {% if not forced %}
        <div class="footer">
            <a href="/" style="color:#64748b;text-decoration:none;"><i class="fas fa-arrow-left me-1"></i>Voltar</a>
        </div>
        {% endif %}
    </div>
</body>
</html>
