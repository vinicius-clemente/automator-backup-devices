<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ device }} — {{ data }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0f1923;
            --bg-card: #1a2d3d;
            --accent: #00d4ff;
            --accent-dim: #0099cc;
            --text: #e0e8f0;
            --text-dim: #8899aa;
        }
        body {
            background: var(--bg-primary);
            color: var(--text);
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .navbar-custom {
            background: linear-gradient(135deg, #0a1628 0%, #1a2d3d 100%);
            border-bottom: 1px solid rgba(0,212,255,0.1);
        }
        .navbar-custom .brand {
            font-weight: 600;
            color: var(--accent);
            text-decoration: none;
        }
        .config-wrapper {
            background: #0d1117;
            border: 1px solid rgba(0,212,255,0.08);
            border-radius: 12px;
            overflow: hidden;
        }
        .config-header {
            background: rgba(0,0,0,0.3);
            padding: 0.8rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(0,212,255,0.08);
        }
        .config-header .filename {
            color: var(--text-dim);
            font-size: 0.85rem;
            font-family: monospace;
        }
        .config-body {
            padding: 0;
            margin: 0;
        }
        .config-body pre {
            background: transparent;
            color: #c9d1d9;
            padding: 1.5rem;
            margin: 0;
            font-size: 0.8rem;
            line-height: 1.5;
            overflow-x: auto;
            font-family: 'Cascadia Code', 'Fira Code', 'JetBrains Mono', monospace;
            tab-size: 4;
        }
        .config-body pre .hl-comment { color: #8b949e; font-style: italic; }
        .config-body pre .hl-keyword { color: #ff7b72; }
        .config-body pre .hl-string { color: #a5d6ff; }
        .config-body pre .hl-number { color: #79c0ff; }
        .config-body pre .hl-section { color: #d2a8ff; }
        .btn-act {
            background: transparent;
            border: 1px solid rgba(0,212,255,0.2);
            color: var(--accent);
            border-radius: 6px;
            padding: 0.3rem 0.8rem;
            font-size: 0.8rem;
            transition: all 0.2s;
            cursor: pointer;
        }
        .btn-act:hover {
            background: rgba(0,212,255,0.1);
            color: #fff;
        }
        .btn-copy {
            background: transparent;
            border: 1px solid rgba(0,212,255,0.2);
            color: var(--accent);
            border-radius: 6px;
            padding: 0.3rem 0.8rem;
            font-size: 0.8rem;
            transition: all 0.2s;
            cursor: pointer;
        }
        .btn-copy:hover {
            background: rgba(0,212,255,0.1);
            color: #fff;
        }
        .line-count {
            color: var(--text-dim);
            font-size: 0.85rem;
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-primary); }
        ::-webkit-scrollbar-thumb { background: var(--bg-card); border-radius: 3px; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand navbar-custom mb-4">
    <div class="container">
        <a class="navbar-brand brand" href="/device/{{ device }}">
            <i class="fas fa-arrow-left me-2" style="color: var(--text-dim);"></i>{{ device }}
        </a>
        <span class="line-count"><i class="fas fa-file-code me-1"></i>{{ data }} · {{ lines }} linhas</span>
        <div class="dropdown">
            <button class="btn-act dropdown-toggle" style="border-color:rgba(0,212,255,0.2);" data-bs-toggle="dropdown">
                <i class="fas fa-user"></i>
            </button>
            <ul class="dropdown-menu dropdown-menu-end" style="background:#1a2d3d;border:1px solid rgba(0,212,255,0.08);border-radius:12px;padding:0.5rem;min-width:180px;">
                <li style="padding:0.25rem 0.75rem;font-size:0.75rem;color:var(--text-dim);"><i class="fas fa-user me-1" style="color:var(--accent);"></i>{{ session.get("nome", session.get("username", "")) }}</li>
                <li><hr style="margin:0.3rem 0;border-color:rgba(0,212,255,0.08);"></li>
                <li><a href="/change-password" class="dropdown-item" style="color:var(--text);font-size:0.8rem;border-radius:8px;padding:0.4rem 0.75rem;"><i class="fas fa-key me-2" style="color:var(--accent-dim);"></i>Alterar Senha</a></li>
                <li><a href="/logout" class="dropdown-item" style="color:var(--danger);font-size:0.8rem;border-radius:8px;padding:0.4rem 0.75rem;"><i class="fas fa-sign-out-alt me-2"></i>Sair</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container">
    <div class="config-wrapper">
                        <div class="config-header">
                            <span class="filename">{{ backup }}</span>
                            <div class="d-flex gap-2">
                                <a href="/download/{{ device }}/{{ backup }}" class="btn-copy">
                                    <i class="fas fa-download me-1"></i> Download
                                </a>
                                <button class="btn-copy" onclick="copyConfig()">
                                    <i class="fas fa-copy me-1"></i> Copiar
                                </button>
                            </div>
                        </div>
        <div class="config-body">
            <pre><code>{{ content }}</code></pre>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
function copyConfig() {
    const text = document.querySelector('.config-body pre').textContent;
    navigator.clipboard.writeText(text);
    const btn = document.querySelector('.btn-copy');
    btn.innerHTML = '<i class="fas fa-check me-1"></i> Copiado!';
    setTimeout(() => btn.innerHTML = '<i class="fas fa-copy me-1"></i> Copiar', 2000);
}
</script>

</body>
</html>
