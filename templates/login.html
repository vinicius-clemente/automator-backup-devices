<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Backup Portal — Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #080c14;
            font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-wrap {
            background: linear-gradient(145deg, #111827, #0f1724);
            border: 1px solid rgba(56,189,248,0.08);
            border-radius: 24px;
            padding: 3rem 2.5rem;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.5);
        }
        .login-wrap .icon {
            text-align: center;
            font-size: 2.5rem;
            color: #38bdf8;
            margin-bottom: 0.5rem;
        }
        .login-wrap h1 {
            text-align: center;
            font-size: 1.4rem;
            font-weight: 800;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.3rem;
        }
        .login-wrap .sub {
            text-align: center;
            font-size: 0.8rem;
            color: #64748b;
            margin-bottom: 2rem;
        }
        .login-wrap label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #64748b;
            margin-bottom: 0.3rem;
            display: block;
        }
        .login-wrap input {
            width: 100%;
            background: #162032;
            border: 1px solid rgba(56,189,248,0.08);
            border-radius: 10px;
            padding: 0.7rem 1rem;
            color: #e2e8f0;
            font-size: 0.9rem;
            transition: all 0.3s;
            margin-bottom: 1.2rem;
        }
        .login-wrap input:focus {
            outline: none;
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56,189,248,0.1);
        }
        .login-wrap button {
            width: 100%;
            background: linear-gradient(135deg, #38bdf8, #0284c7);
            border: none;
            border-radius: 10px;
            padding: 0.75rem;
            font-weight: 700;
            color: #fff;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s;
        }
        .login-wrap button:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 25px rgba(56,189,248,0.2);
        }
        .erro {
            background: rgba(239,68,68,0.1);
            color: #ef4444;
            border: 1px solid rgba(239,68,68,0.2);
            border-radius: 8px;
            padding: 0.5rem;
            font-size: 0.8rem;
            text-align: center;
            margin-bottom: 1rem;
        }
        .login-wrap .footer {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.7rem;
            color: #475569;
        }
    </style>
</head>
<body>
    <div class="login-wrap">
        <div class="icon"><i class="fas fa-shield-alt"></i></div>
        <h1>Backup Portal</h1>
        <p class="sub">Acesso restrito</p>
        {% if erro %}
        <div class="erro"><i class="fas fa-exclamation-circle me-1"></i>{{ erro }}</div>
        {% endif %}
        <form method="POST">
            <label><i class="fas fa-user me-1"></i>Usuário</label>
            <input type="text" name="user" placeholder="admin" required autofocus>
            <label><i class="fas fa-lock me-1"></i>Senha</label>
            <input type="password" name="pass" placeholder="••••••" required>
            <button type="submit"><i class="fas fa-arrow-right me-2"></i>Entrar</button>
        </form>
        <div class="footer"><i class="fas fa-database me-1"></i> Backup Portal</div>
    </div>
</body>
</html>
